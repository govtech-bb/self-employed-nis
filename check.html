<style>
  :root {
    --color-yellow-00:#e8a833; --color-yellow-100:#ffc726; --color-yellow-40:#ffe9a8; --color-yellow-10:#fff9e9;
    --color-blue-00:#00164a; --color-blue-100:#00267f; --color-blue-40:#99a8cc; --color-blue-10:#e5e9f2;
    --color-black-00:#000; --color-mid-grey-00:#595959; --color-grey-00:#e0e4e9; --color-white-00:#fff;
    --color-green-00:#00654a; --color-green-100:#1fbf84; --color-green-40:#a5e5ce; --color-green-10:#e9f9f3;
    --color-red-00:#a42c2c; --color-red-100:#ff6b6b; --color-red-40:#ffc4c4; --color-red-10:#fff0f0;
    --color-teal-00:#0e5f64; --color-teal-100:#30c0c8; --color-teal-40:#ace6e9; --color-teal-10:#eaf9f9;
    --color-purple-00:#4a235a; --color-purple-100:#a962c7;
    --color-pink-00:#ad1157; --color-pink-100:#ff94d9;

    /* alpha.gov.bb design tokens */
    --spacing-xs: 0.5rem;  --spacing-s: 1rem;  --spacing-xm: 1.5rem;
    --spacing-m: 2rem;     --spacing-l: 4rem;  --spacing-xl: 8rem;
    --radius-sm: 0.25rem;  --radius-md: 0.375rem;  --radius-lg: 0.5rem;
    --shadow-form-hover: inset 4px 4px 0px 0px #0000001a;
  }
  html, body { font-family: Figtree, -apple-system, system-ui, sans-serif; }
  body {
    font-weight: 400; line-height: 1.55;
    display: grid; min-height: 100vh; grid-template-rows: auto 1fr auto;
    background: var(--color-white-00); color: var(--color-black-00);
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  .container { max-width: 1200px; margin-inline: auto; padding-inline: 16px; }
  .stage { max-width: 600px; margin-inline: auto; }
  .stage-wide { max-width: 760px; margin-inline: auto; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  /* Programmatic focus targets (skip link -> <main>, screen-change -> <h1>).
     These get focus() for screen-reader context, not for keyboard operation,
     so no visible focus ring. */
  main:focus, h1[tabindex="-1"]:focus { outline: none; }

  /* Range sliders */
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 10px;
    background: #e5e9f2; border-radius: 999px; outline: none;
    background-image: linear-gradient(#0e5f64, #0e5f64);
    background-size: 0% 100%; background-repeat: no-repeat;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 32px; height: 32px;
    border-radius: 50%; background: #0e5f64; cursor: pointer;
    border: 5px solid #fff; box-shadow: 0 2px 8px rgba(0,22,74,0.25);
  }
  input[type=range]::-moz-range-thumb {
    width: 32px; height: 32px; border-radius: 50%; background: #0e5f64; cursor: pointer;
    border: 5px solid #fff; box-shadow: 0 2px 8px rgba(0,22,74,0.25);
  }
  input[type=range]:focus-visible { box-shadow: 0 0 0 4px #30c0c8; }

  /* Screen transitions */
  .screen { animation: fade 0.32s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* Entrance animation runs on real navigation only. In-place re-renders
     (selecting a card or radio rebuilds the screen) add .no-anim to #app
     so the fade does not replay on every press. */
  .no-anim .screen { animation: none; }

  /* Selectable cards */
  .selectable { transition: all .18s ease; }
  .selectable[aria-checked="true"],
  .selectable.selected {
    border-color: #0e5f64; background: #eaf9f9;
    box-shadow: 0 0 0 2px #0e5f64 inset;
  }

  /* Buttons */
  .btn-primary {
    background: #0e5f64; color: #fff;
    transition: background-color .15s, box-shadow .15s, transform .05s;
  }
  .btn-primary:hover { background: #1a777d; box-shadow: inset 0 0 0 4px rgba(222,245,246,0.10); }
  .btn-primary:active { background: #0a4549; transform: translateY(1px); }
  .btn-primary:focus-visible { outline: none; box-shadow: 0 0 0 4px #30c0c8; }
  .btn-primary:disabled { background: #99a8cc; cursor: not-allowed; box-shadow: none; }
  /* "Not ready yet" state: aria-disabled keeps the button focusable so keyboard and
     screen-reader users can reach it and hear why it does nothing yet.
     Grey-00 bg + mid-grey text = 5.4:1, so it passes AA even though it looks muted. */
  .btn-primary[aria-disabled="true"],
  .btn-primary[aria-disabled="true"]:hover,
  .btn-primary[aria-disabled="true"]:active {
    background: var(--color-grey-00); color: var(--color-mid-grey-00);
    cursor: not-allowed; box-shadow: none; transform: none;
  }
  .btn-primary[aria-disabled="true"]:focus-visible { outline: none; box-shadow: 0 0 0 4px #30c0c8; }
  /* Hint announced (role=status) and shown when a not-ready Continue is pressed */
  .disabled-hint { color: var(--color-red-00); font-size: 0.95rem; }
  .disabled-hint:not(:empty) { margin-top: 0.75rem; }

  /* Inline step error — sits after the title/description; filled on click of a
     not-ready Continue (role=alert). Empty by default so it takes no space. */
  .step-error { color: var(--color-red-00); font-weight: 600; }
  .step-error:not(:empty) {
    margin: 0 0 1.25rem; padding-left: 1rem; border-left: 4px solid var(--color-red-00);
  }

  .btn-secondary {
    background: #fff; color: #0e5f64; border: 2px solid #0e5f64;
    transition: background-color .15s, color .15s;
  }
  .btn-secondary:hover { background: #eaf9f9; }
  .btn-secondary:focus-visible { outline: none; box-shadow: 0 0 0 4px #30c0c8; }

  /* GOV.BB Secondary button — used as the form "Previous" control (grey fill,
     black text) paired with the primary "Continue" at the bottom of a step. */
  .btn-previous {
    background: #e0e4e9; color: #000;
    transition: background-color .15s, box-shadow .15s;
  }
  .btn-previous:hover { box-shadow: inset 0 0 0 4px rgba(0,0,0,0.05); }
  .btn-previous:active { background: #b9c0c6; }
  .btn-previous:focus-visible { outline: none; box-shadow: 0 0 0 4px #30c0c8; }

  /* Links */
  .link-bb {
    color: #0e5f64; text-decoration: underline; text-underline-offset: 2px;
  }
  .link-bb:hover { color: #000; background: #eaf9f9; text-decoration: none; }
  .link-bb:focus-visible { outline: none; background: #ffc726; color: #000; text-decoration: none; }

  /* Expandable cards */
  details.scenario summary { list-style: none; cursor: pointer; }
  details.scenario summary::-webkit-details-marker { display: none; }
  details.scenario[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform .2s ease; }

  /* Soft pattern dot background for hero */
  .hero-bg {
    background-image:
      radial-gradient(circle at 20% 20%, rgba(48,192,200,0.18), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(255,199,38,0.22), transparent 40%);
  }

  /* Steppers */
  .stepper-btn {
    width: 44px; height: 44px; border-radius: 999px;
    border: 2px solid var(--color-teal-00); color: var(--color-teal-00);
    background: #fff; font-size: 1.25rem; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .stepper-btn:hover { background: var(--color-teal-10); }
  .stepper-btn:disabled { border-color: var(--color-grey-00); color: var(--color-grey-00); cursor: not-allowed; background: #fff; }
  .stepper-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--color-teal-100); }

  /* Tag/chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600;
  }

  /* Bar visualization (for protection level) */
  .protect-bar {
    height: 14px; border-radius: 999px; background: var(--color-grey-00);
    overflow: hidden; position: relative;
  }
  .protect-bar-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #1fbf84, #30c0c8);
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }

  /* Honour reduced-motion: no screen fade/slide, no animated transitions.
     This block stays at the END of the stylesheet so nothing declared later
     can reintroduce motion. The !important catch-all covers everything:
     the .screen fade, the .selectable/.chev/.protect-bar-fill transitions,
     and Tailwind utility transitions (transition-all on input wrappers,
     button colour fades). */
  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

const fmtMoney = n => 'BDS$' + Math.round(n).toLocaleString('en-BB');

/* ─────────────────────────────────────────────────────────
   NIS benefit calculation constants & helpers
   Sources: official nis.gov.bb benefit pages + NISSS meeting 2026-06-02.
   • Self-employed contribution rate 17.25% (incl. RNR) — meeting 02:14:03.
   • Benefits are a % of INSURABLE EARNINGS, not of the contribution — meeting 02:16:33.
   • Max insurable earnings $5,360/mo (max annual contribution $11,095.20) — meeting 02:12:39.
   All figures are estimates and must be confirmed/validated by NISSS Benefits.
   ───────────────────────────────────────────────────────── */
const NIS = {
  SE_RATE: 0.1725,            // self-employed contribution rate (incl. RNR)
  MAX_MONTHLY_INSURABLE: 5360,
  MIN_ANNUAL_CONTRIBUTION: 1200,
  // replacement rates (share of insurable earnings)
  SICKNESS_RATE: 2 / 3,       // 66⅔%
  MATERNITY_RATE: 1.0,        // 100%
  PATERNITY_RATE: 1.0,        // 100%
  INVALIDITY_RATE: 0.40,      // 40% of average insurable earnings (up to 60%)
  INVALIDITY_MIN_WK: 254,     // minimum invalidity pension per week
  // fixed amounts
  FUNERAL_GRANT: 2220,
  CHILD_GRANT: 1280,
  // durations / ages
  SICKNESS_MAX_WEEKS: 26,         // up to 26 more with 150 contribution weeks + 75 in the prior 3 years (nis.gov.bb/sickness-benefit)
  PATERNITY_WEEKS: 3,
  PENSIONABLE_AGE: 67,
};

// Shown under a money field when the entry exceeds the insurable ceiling.
// Not an error: any amount is accepted, but only earnings up to the ceiling
// count toward contributions and benefits.
const CEILING_NOTE = 'The most NIS can insure is ' + fmtMoney(NIS.MAX_MONTHLY_INSURABLE)
  + ' a month. Amounts above this do not change your estimate.';

// Annual contribution -> monthly insurable earnings (capped at the ceiling).
function monthlyInsurableFromContribution(annualContribution) {
  const raw = (annualContribution / NIS.SE_RATE) / 12;
  return Math.min(NIS.MAX_MONTHLY_INSURABLE, raw);
}
// Monthly insurable earnings -> weekly insurable earnings.
// The user's seasonality answer, used by the risk and plan maths. The journey
// requires and validates it before either formula can run; the fallback of 6
// (half the year, assuming no seasonality) covers programmatic deep-navigation
// only and deliberately replaces the old hardcoded 9-good/3-slow split (#38).
function goodMonthsValue() {
  const gm = state.data.goodMonthsPerYear;
  return Number.isInteger(gm) && gm >= 1 && gm <= 12 ? gm : 6;
}

const weeklyInsurableFromMonthly = monthly => monthly * 12 / 52;

function progressBar(currentId) {

        <span>${Math.round(((idx + 1) / total) * 100)}% through the guide</span>

}

// Primary action — alpha.gov.bb button styling (rounded-sm, 20px on desktop,
// 18px on mobile so long labels don't wrap awkwardly on narrow screens,
// inset hover/active shadows). Width: full-column.
//
// The button is NEVER disabled or greyed (GOV.UK pattern). When opts.disabled
// marks the step as not-ready, clicking shows opts.hint as an inline error in
// the screen's #step-error region (which sits after the title/description)
// instead of navigating. Screens with a gated Continue must render ${stepError()}.
function primaryBtn(label, action, opts = {}) {
  const isGated = !!opts.disabled;
  const hint = (opts.hint || 'Answer the question above to continue.').replace(/"/g, '&quot;');
  const onclick = isGated ? 'showStepError(this)' : action;
  const dataHint = isGated ? ` data-hint="${hint}"` : '';

  // Form-step layout: a GOV.BB "Previous" (Secondary) + "Continue" (Primary)
  // pair at the bottom of the step, matching the alpha.gov.bb form pattern.
  // The Continue here is the exact GOV.BB Primary: 20px regular, no arrow.
  if (opts.back) {
    return `
    <div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center">
      ${previousBtn(opts.back)}
      <button type="button" onclick="${onclick}"${dataHint}
        class="btn-primary inline-flex items-center justify-center px-xm py-s rounded-sm text-[1.25rem] font-normal leading-[1.5] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">
        ${label}
      </button>
    </div>`;
  }

  return `
    <button type="button" onclick="${onclick}"${dataHint}
      class="btn-primary w-full inline-flex items-center justify-center gap-2 px-xm py-s rounded-sm text-[1.25rem] sm:text-[1.25rem] font-semibold leading-[1.5] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">
      ${label} ${opts.arrow !== false ? ICONS.arrowRight : ''}
    </button>`;
}

// Empty error region placed right after a step's title + description. A gated
// Continue writes its message here on click (see showStepError).
function stepError() {
  return `<p id="step-error" class="step-error" role="alert"></p>`;
}

// GOV.BB Secondary button used as the form "Previous" control.
function previousBtn(target) {
  return `
    <button type="button" onclick="nav('${target}')"
      class="btn-previous inline-flex items-center justify-center px-xm py-s rounded-sm text-[1.25rem] font-normal leading-[1.5] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">
      Previous
    </button>`;
}

// Write a message into a live region. Clear first, then set on the next
// frame: writing identical text into a role=status element is deduped by
// AT, so a repeated message would otherwise be silent.
function setLiveRegion(el, msg) {
  if (!el) return;
  el.textContent = '';
  requestAnimationFrame(() => { el.textContent = msg; });
}

// Pressing a not-ready Continue: announce + show why it does nothing yet.
function showDisabledHint(btn) {
  const el = btn.nextElementSibling;
  if (!el || !el.classList.contains('disabled-hint')) return;
  setLiveRegion(el, btn.dataset.hint || '');
}

// A not-ready Continue was clicked: show its message in the step's #step-error
// region (after the title/description) and bring it into view. The button is
// never disabled, so this is how the user learns what's still needed.
function showStepError(btn) {
  const region = document.getElementById('step-error');
  if (!region) return;
  setLiveRegion(region, btn.dataset.hint || '');
  region.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Announce content revealed or updated by a selection (plan details, the
// dependants count question). Short, polite, and scoped, not a whole-app
// live region.
function announce(msg) {
  setLiveRegion(document.getElementById('reveal-status'), msg);
}

// External link styled as a primary button. Use when the action leaves the tool
// for the real NIS site: a real <a> gives keyboard, middle-click, "open in new
// tab" and screen-reader semantics a <button onclick> can't. Opens in a new tab
// and tells screen-reader users so.
function primaryLink(label, href) {
  return `
    <a href="${href}" target="_blank" rel="noopener noreferrer"
      class="btn-primary w-full inline-flex items-center justify-center gap-2 px-xm py-s rounded-sm text-[1.25rem] sm:text-[1.25rem] font-semibold leading-[1.5] no-underline focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-offset-1 focus-visible:ring-bb-teal-100">
      ${label}${NEW_TAB_CUE} ${ICONS.arrowRight}
    </a>`;
}

// What a number field should show: the exact text the user last typed (so a
// re-render never swaps "-500" for something else), else the stored value.
function numVal(id, num) {
  const r = state.raw[id];
  if (r !== undefined) return String(r).replace(/"/g, '&quot;');
  return num == null ? '' : num;
}

function secondaryBtn(label, action) {
  return `
    <button type="button" onclick="${action}"

    </button>`;
}

              class="w-full p-3 outline-none rounded-[inherit] text-[1.25rem] tabular-nums" />
          </div>
        </div>
        <p id="goodMonthsPerYear-error" class="mt-2 text-bb-red-00 text-[1rem]"${e.goodMonthsPerYear ? '' : ' hidden'}>${e.goodMonthsPerYear || ''}</p>
      </div>

      ${primaryBtn('Continue', 'nextFromIncome()', { back: LEAN_ESTIMATOR ? 'landing' : 'worker-type' })}
    </div>`;
}

/* ─────────────────────────────────────────────────────────
   SCREEN 3b — Your situation
   ───────────────────────────────────────────────────────── */
function screenYourSituation() {
  const d = state.data;

  function radioGroup(name, options, onClick) {
    return options.map(o => {
      const selected = d[name] === o.id;
      const handler = onClick ? onClick(o) : `state.data.${name} = '${o.id}'; render();`;
      return `
        <button type="button" role="radio" aria-checked="${selected}"
          onclick="${handler}"
          class="selectable text-left rounded-xl border-2 border-bb-grey-00 bg-white p-4 flex items-center gap-3 hover:border-bb-teal-00 hover:bg-bb-teal-10/40 focus:outline-none focus-visible:ring-4 focus-visible:ring-bb-teal-100 ${selected ? 'selected' : ''}">
          <span class="shrink-0 w-6 h-6 rounded-full inline-flex items-center justify-center ${selected ? 'bg-bb-teal-00 text-white' : 'border-2 border-bb-grey-00 text-transparent'}">
            ${ICONS.check}
          </span>
          <span class="text-[1.25rem] text-bb-black-00">${o.label}</span>
        </button>`;
    }).join('');
  }

  return `
    <div class="screen stage">
      ${backBtn('income-reality')}
      ${progressBar('your-situation')}
      ${serviceCaption()}

      <h1 class="font-bold text-[2.25rem] sm:text-[2.75rem] leading-[1.15] text-bb-blue-00 mb-2">
        Tell us a bit more about your situation.
      </h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-6">
        This helps us show you what would happen if you couldn't earn for a while.
      </p>
      ${stepError()}

      <h2 class="font-bold text-[1.25rem] text-bb-blue-00 mb-3">Does anyone depend on your income?</h2>
      <div class="flex flex-col gap-3 ${d.hasDependants === 'yes' ? 'mb-4' : 'mb-6'}" role="radiogroup" aria-label="Dependants">
        ${radioGroup('hasDependants', [
          { id: 'yes', label: 'Yes, others rely on what I earn' },
          { id: 'no',  label: "No, it's just me" }
        ], o => `setDependants('${o.id}')`)}
      </div>

      ${d.hasDependants === 'yes' ? (() => {
        const countMsg = dependantsCountError();
        return `
        <div class="mb-6">
          <label for="dependantsCount" class="block font-semibold text-bb-blue-00 mb-1">How many people depend on your income?</label>
          <p id="dependantsCount-hint" class="text-[1rem] text-bb-mid-grey-00 mb-3">Include children, a partner or relatives who rely on what you earn.</p>
          <div id="dependantsCount-wrap" class="relative inline-flex rounded-sm border-2 ${countMsg ? 'border-bb-red-00' : 'border-bb-grey-00'} items-center transition-all bg-bb-white-00 hover:shadow-form-hover focus-within:ring-4 focus-within:ring-bb-teal-100" style="width: 100px;">
            <input id="dependantsCount" type="number" inputmode="numeric" min="1" max="20" step="1"
              value="${numVal('dependantsCount', d.dependantsCount || '')}"
              placeholder="e.g. 2"
              oninput="updateDependantsCount(this)"
              onchange="normaliseDependantsCount(this)"
              onpaste="numberPaste(event)"
              aria-label="Number of people who depend on your income"
              aria-describedby="dependantsCount-hint dependantsCount-error"
              aria-invalid="${countMsg ? 'true' : 'false'}"
              class="w-full p-3 outline-none rounded-[inherit] text-[1.25rem] tabular-nums" />
          </div>
          <p id="dependantsCount-error" class="mt-2 text-bb-red-00 text-[1rem]">${countMsg || ''}</p>
        </div>`;
      })() : ''}

      <h2 class="font-bold text-[1.25rem] text-bb-blue-00 mb-3">If you couldn't work for 3 weeks tomorrow, do you have savings to cover it?</h2>
      <div class="flex flex-col gap-3 mb-6" role="radiogroup" aria-label="Savings">
        ${radioGroup('hasSavings', [
          { id: 'yes',      label: 'Yes' },
          { id: 'no',       label: 'No' },
          { id: 'not-sure', label: 'Not sure' }
        ])}
      </div>

      <h2 class="font-bold text-[1.25rem] text-bb-blue-00 mb-3">Are you paying National Insurance now for your self-employed work?</h2>
      <div class="flex flex-col gap-3 mb-6" role="radiogroup" aria-label="Current NIS status">
        ${radioGroup('payingNIS', [
          { id: 'yes',            label: 'Yes, I pay it' },
          { id: 'registered',     label: "I'm registered but not paying" },
          { id: 'no',             label: 'No' }
        ])}
      </div>

      <div id="situation-continue">${situationContinue()}</div>
    </div>`;
}

// Continue button for the your-situation screen. Lives in its own helper so
// updateDependantsCount() can refresh it in place while the user types
// (a full render() would fight the caret in the count field). The hint names
// the actual blocker instead of always saying "all three questions".
function situationContinue() {
  const d = state.data;
  const missingRadios = !d.hasDependants || !d.hasSavings || !d.payingNIS;
  const missingCount = d.hasDependants === 'yes' && !d.dependantsCount;
  // An invalid count (fractional, out of range, not a number) keeps the gate
  // closed exactly like an empty one; the hint names the real blocker.
  const invalidCount = d.hasDependants === 'yes' && !!dependantsCountError();
  const hint = missingRadios
    ? 'Answer all the questions above to continue.'
    : invalidCount
      ? 'Enter a whole number of people from 1 to 20 to continue.'
      : 'Enter how many people depend on your income to continue.';
  return primaryBtn('Continue', "nav('plan')", { disabled: missingRadios || missingCount, hint, back: 'income-reality' });
}

/* ─────────────────────────────────────────────────────────
   SCREEN 4 — Risk awareness (now runs AFTER income, so the
   figures below reflect what the user actually earns)
   ───────────────────────────────────────────────────────── */
function screenRiskAwareness() {
  const d = state.data;

  // ── What you'd lose, from your earnings ──────────────────────
  const monthsLost = (d.goodMonth + d.slowMonth) / 2;
  const twoWeeksLost = Math.round(monthsLost / 2);
  const gmYear = goodMonthsValue();
  const yearLost = Math.round((d.goodMonth * gmYear) + (d.slowMonth * (12 - gmYear)));

  // ── What NISSS pays, from the plan just chosen on the previous step ──
  const tier = d.contributionTier; // null | 'minimum' | 'safer' | 'strong'
  const annualIncome = (d.goodMonth * gmYear) + (d.slowMonth * (12 - gmYear));
  const monthlyAvg = annualIncome / 12;
  const minMonthly    = 100;
  const saferMonthly  = Math.max(150, Math.round(monthlyAvg * 0.10 / 10) * 10);
  const strongMonthly = Math.max(225, Math.round(monthlyAvg * 0.15 / 10) * 10);
  const chosen =
    tier === 'minimum' ? minMonthly :
    tier === 'safer'   ? saferMonthly :
    tier === 'strong'  ? strongMonthly : null;

  const annualContribution = chosen ? chosen * 12 : 0;
  const monthlyInsurable   = chosen ? monthlyInsurableFromContribution(annualContribution) : 0;
  const weeklyInsurable    = weeklyInsurableFromMonthly(monthlyInsurable);
  const sicknessWk   = weeklyInsurable * NIS.SICKNESS_RATE;
  const maternityWk  = weeklyInsurable * NIS.MATERNITY_RATE;
  const paternityWk  = weeklyInsurable * NIS.PATERNITY_RATE;
  const invalidityWk = Math.max(NIS.INVALIDITY_MIN_WK, weeklyInsurable * NIS.INVALIDITY_RATE);
  const pensionWk    = weeklyInsurable * NIS.INVALIDITY_RATE;
  const perWeek = wk => `<strong class="tabular-nums">${fmtMoney(wk)}</strong> a week <span class="text-bb-mid-grey-00">(about ${fmtMoney(wk * 52 / 12)}/month)</span>`;

  // Reached here without a plan (e.g. deep link) — send them to pick one first.
  if (!tier) {
    return `
      <div class="screen stage">
        ${backBtn('plan')}
        ${progressBar('risk-awareness')}
        ${serviceCaption()}
        <h1 class="font-bold text-[2.25rem] sm:text-[2.75rem] leading-[1.15] text-bb-blue-00 mb-2">Pick a plan first</h1>
        <p class="text-[1.25rem] text-bb-mid-grey-00 mb-6">Choose a contribution level and we'll show you exactly what it protects.</p>
        ${primaryBtn("Choose a plan", "nav('plan')")}
      </div>`;
  }

  // Each life moment paired with the benefit that covers it. The card colour
  // and icon come from BENEFITS (the step-3 styling the user liked); the
  // Without / With NISSS split is the step-2 style.
  const items = [
    { benefit: 'sickness', title: "What happens if you get sick?",
      without: `Two weeks off sick is about <strong>${fmtMoney(twoWeeksLost)}</strong> you couldn't earn — rent, food and bills still due.`,
      withNis: `Sickness Benefit pays about ${perWeek(sicknessWk)}, roughly two-thirds of your usual earnings, for up to ${NIS.SICKNESS_MAX_WEEKS} weeks. If you're still unwell after that, NISSS may pay for up to 26 more weeks.` },
    { benefit: 'invalidity', title: 'What happens if a long illness or injury stops you working?',
      without: 'No safety net. Savings go fast, and family has to step in.',
      withNis: `Invalidity Pension gives ongoing income of about ${perWeek(invalidityWk)} (at least ${fmtMoney(NIS.INVALIDITY_MIN_WK)} a week).` },
    { benefit: 'maternity', title: "You're starting a family",
      without: 'Time off means no money coming in. Many parents go back to work too soon.',
      withNis: `Maternity Benefit pays about ${perWeek(maternityWk)}, and new fathers get a ${NIS.PATERNITY_WEEKS}-week paid break of about ${perWeek(paternityWk)}.` },
    { benefit: 'pension', title: "You're 67 and ready to slow down",
      without: `Without a pension, that's about <strong>${fmtMoney(yearLost)}/year</strong> you'd need to find from somewhere else.`,
      withNis: `An Old-Age Pension for life from age ${NIS.PENSIONABLE_AGE}, starting around ${perWeek(pensionWk)} and growing the longer you contribute.` },
    { benefit: 'survivors', title: 'What if something happens to you?',
      without: 'Your partner, children or parents lose the income you brought in.',
      withNis: `Survivors share about ${perWeek(pensionWk)}, plus a ${fmtMoney(NIS.CHILD_GRANT)} grant per child and a ${fmtMoney(NIS.FUNERAL_GRANT)} funeral grant.` },
  ];

  return `
    <div class="screen stage">
      ${backBtn('plan')}
      ${progressBar('risk-awareness')}
      ${serviceCaption()}

      <h1 class="font-bold text-[2.25rem] sm:text-[2.75rem] leading-[1.15] text-bb-blue-00 mb-2">
        What your plan protects you from
      </h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-6">
        For <strong class="tabular-nums">${fmtMoney(chosen)}</strong>/month, here's each moment <strong class="text-bb-red-00">without NISSS</strong> and <strong class="text-bb-green-00">with it</strong>. Figures are estimates based on what you earn.
      </p>

      <div class="space-y-3 mb-6">
        ${items.map((it, i) => {
          const def = BENEFITS.find(x => x.id === it.benefit);
          const c = def ? COLOR_MAP[def.color] : COLOR_MAP.teal;
          // First card open on arrival; after that, follow whatever the user toggled.
          const open = state.expandedScenario ? state.expandedScenario === it.benefit : i === 0;
          return `
            <details class="scenario rounded-xl border border-bb-grey-00 bg-white overflow-hidden" ${open ? 'open' : ''} onclick="toggleScenario('${it.benefit}', event)">
              <summary class="p-4 flex items-start gap-3 hover:bg-bb-blue-10/30">
                <span class="shrink-0 inline-flex items-center justify-center w-11 h-11 rounded-full ${c.bg} ${c.text}">${ICONS[def ? def.icon : 'shield']}</span>
                <span class="flex-1 min-w-0">
                  <span class="block font-semibold text-[1.25rem] text-bb-blue-00">${it.title}</span>
                  <span class="block text-[1rem] text-bb-mid-grey-00 mt-1">Tap to see what happens</span>
                </span>
                <span class="shrink-0 text-bb-mid-grey-00 mt-2">${ICONS.chevDown}</span>
              </summary>
              <div class="px-4 pb-5 pt-4 space-y-3 border-t border-bb-grey-00">
                <div class="rounded-lg bg-bb-red-10 border border-bb-red-40/60 p-3">
                  <p class="text-[0.95rem] uppercase tracking-wide text-bb-red-00 font-semibold mb-1">Without NISSS</p>
                  <p class="text-[1.125rem] text-bb-blue-00">${it.without}</p>
                </div>
                <div class="rounded-lg bg-bb-green-10 border border-bb-green-40 p-3">
                  <p class="text-[0.95rem] uppercase tracking-wide text-bb-green-00 font-semibold mb-1">With NISSS</p>
                  <p class="text-[1.125rem] text-bb-blue-00">${it.withNis}</p>
                </div>
              </div>
            </details>
          `;
        }).join('')}
      </div>

      <div class="rounded-2xl bg-bb-yellow-10 border border-bb-yellow-40 p-4 mb-6 flex items-start gap-3">
        <span class="text-bb-yellow-00 shrink-0 mt-0.5">${ICONS.spark}</span>
        <p class="text-[1rem] text-bb-blue-00">
          <strong>You don't have to plan for every scenario.</strong> NISSS gives you benefits across several of them at once. That's the point of a safety net.
        </p>
      </div>

      ${primaryBtn("Show me next steps", "nav('next-steps')", { back: 'plan' })}
      <p class="text-center text-[0.95rem] text-bb-mid-grey-00 mt-3">
        Estimates only. Benefit amounts are calculated from your insurable earnings (your contribution ÷ 17.25%) and your most recent year of contributions, and are subject to change. Final amounts are confirmed by NISSS Benefits.
      </p>
    </div>`;
}

/* ─────────────────────────────────────────────────────────
   SCREEN 3 — Plan (combines contribution choice + protection levels +
                    benefit estimates + future-self framing into ONE page)

   When no tier is selected:  user sees the 3 tier cards.
   When a tier IS selected:   the gradient "your plan" hero, benefit
                              estimates, and protection bars appear
                              inline below — no extra clicks.
   ───────────────────────────────────────────────────────── */
function screenPlan() {
  const d = state.data;

  // Annual income — uses defaults if user jumped here directly
  const goodMonths = goodMonthsValue();
  const annualIncome = (d.goodMonth * goodMonths) + (d.slowMonth * (12 - goodMonths));
  const monthlyAvg = annualIncome / 12;

  // Tier amounts
  const minMonthly    = 100;
  const saferMonthly  = Math.max(150, Math.round(monthlyAvg * 0.10 / 10) * 10);
  const strongMonthly = Math.max(225, Math.round(monthlyAvg * 0.15 / 10) * 10);

  const tier = d.contributionTier; // null | 'minimum' | 'safer' | 'strong'
  const chosen =
    tier === 'minimum' ? minMonthly :
    tier === 'safer'   ? saferMonthly :
    tier === 'strong'  ? strongMonthly : null;

  // Relative protection level — drives the bar fill in the hero.
  // This is a QUALITATIVE indicator only (more contributions = more benefits).
  // Exact benefit figures are shown on the next step.
  const protectionPct =
    tier === 'minimum' ? 40 :
    tier === 'safer'   ? 70 :
    tier === 'strong'  ? 95 : 0;
  const protectionLabel =
    tier === 'minimum' ? 'Basic benefits' :
    tier === 'safer'   ? 'Better benefits' :
    tier === 'strong'  ? 'Strongest benefits' : '';

  // Tier card definitions
  const tiers = [
    {
      id: 'minimum', label: 'Minimum', monthly: minMonthly, tag: 'Basic', color: 'yellow',
      sub: 'Smaller payouts when you claim — but you still qualify for every benefit.',
    },
    {
      id: 'safer', label: 'Moderate', monthly: saferMonthly, tag: 'Recommended', color: 'green',
      sub: 'A bigger share of your earnings, for stronger benefits.',
    },
    {
      id: 'strong', label: 'Stronger', monthly: strongMonthly, tag: 'Maximum', color: 'teal',
      sub: "Closest to an employee's contributions — the strongest benefits.",
    },
  ];

  return `
    <div class="screen stage">
      ${backBtn(LEAN_ESTIMATOR ? 'income-reality' : 'your-situation')}
      ${progressBar('plan')}
      ${serviceCaption()}

      <h1 class="font-bold text-[2.25rem] sm:text-[2.75rem] leading-[1.15] text-bb-blue-00 mb-2">
        What should you put in?
      </h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-6">
        Pick a level that fits your budget. Next, you'll see exactly what it protects.
      </p>
      ${stepError()}

      <!-- Earnings summary -->
      <div class="rounded-2xl border border-bb-blue-10 bg-bb-blue-10/40 p-4 mb-5">
        <p class="text-[1rem] text-bb-mid-grey-00 mb-1">Based on what you told us</p>
        <p class="text-[1.25rem] text-bb-blue-00">
          Average earnings: <strong class="tabular-nums">${fmtMoney(monthlyAvg)}</strong>
          <span class="text-bb-mid-grey-00">/ month</span>
        </p>
      </div>

      <!-- Tier cards -->
      <div class="space-y-3 mb-6" role="radiogroup" aria-label="Contribution tier">
        ${tiers.map(t => {
          const selected = tier === t.id;
          const c = COLOR_MAP[t.color];
          return `
            <button type="button" role="radio" aria-checked="${selected}"
              onclick="selectTier('${t.id}')"
              class="selectable text-left rounded-xl border-2 ${selected ? '' : c.border + ' ' + c.bg} bg-white p-4 w-full focus:outline-none focus-visible:ring-4 focus-visible:ring-bb-teal-100 ${selected ? 'selected' : ''}">
              <div class="flex items-start justify-between gap-3">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <p class="font-semibold text-[1.25rem] text-bb-blue-00">${t.label}</p>
                    <span class="chip bg-white ${c.text} border ${c.border}">${t.tag}</span>
                  </div>
                  <div class="mt-1 flex items-baseline gap-2">
                    <span class="text-[1.75rem] font-bold ${c.text} tabular-nums">${fmtMoney(t.monthly)}</span>
                    <span class="text-bb-mid-grey-00 text-[1rem]">/ month</span>
                  </div>
                  <p class="text-[1rem] text-bb-mid-grey-00 mt-2">${t.sub}</p>
                </div>
                <span class="shrink-0 w-6 h-6 mt-1 rounded-full inline-flex items-center justify-center ${selected ? 'bg-bb-teal-00 text-white' : 'border-2 border-bb-grey-00 text-transparent'}">${ICONS.check}</span>
              </div>
            </button>
          `;
        }).join('')}
      </div>

      ${tier ? `
        <!-- Slim plan summary: the payoff + protection, not a repeat of the price -->
        <div id="plan-hero" class="rounded-3xl bg-gradient-to-br from-bb-teal-00 to-bb-blue-100 text-white p-6 mb-4 shadow-card-hover">
          <p class="text-[0.95rem] uppercase tracking-wide text-bb-teal-40 font-semibold mb-3">Your plan</p>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[1rem] text-white/90">Your protection level</span>
            <span class="text-[1rem] font-semibold text-white">${protectionLabel}</span>
          </div>
          <div class="protect-bar bg-white/20">
            <div class="protect-bar-fill" style="width: ${protectionPct}%"></div>
          </div>
          <p class="text-[1.25rem] leading-[1.4] mt-4">
            In 10 years, that's about <strong class="tabular-nums">${fmtMoney(chosen * 12 * 10)}</strong> put toward your benefits.
          </p>
        </div>

        <!-- How paying works (moved out of the plan card) -->
        <div class="rounded-2xl bg-bb-yellow-10 border border-bb-yellow-40 p-4 mb-6 space-y-3">
          <div class="flex items-start gap-3">
            <span class="text-bb-yellow-00 shrink-0 mt-0.5">${ICONS.spark}</span>
            <p class="text-[1rem] text-bb-blue-00"><strong>Slow month?</strong> Pay less or skip, no penalty. <strong>Good month?</strong> Top up. What counts is the yearly total.</p>
          </div>
          <div class="flex items-start gap-3">
            <span class="text-bb-yellow-00 shrink-0 mt-0.5">${ICONS.clock}</span>
            <p class="text-[1rem] text-bb-blue-00"><strong>Benefits start</strong> after one full year of contributions (at least BDS$1,200).</p>
          </div>
        </div>
      ` : ''}

      ${primaryBtn("See what this protects", "nav('risk-awareness')", { disabled: !tier, hint: 'Pick a contribution level above to continue.', back: LEAN_ESTIMATOR ? 'income-reality' : 'your-situation' })}
    </div>`;
}

function screenRegisterPath() {
  // "Came through the journey" proxy for the Back target: the full journey
  // guarantees a worker type before next-steps; the lean journey never asks
  // it, so the tier pick (gated on the plan screen) marks arrival instead.
  const cameFromJourney = LEAN_ESTIMATOR ? state.data.contributionTier : state.data.workerType;
  return `
    <div class="screen stage">
      ${backBtn(state.screen === 'register-path' && JOURNEY.indexOf('next-steps') > -1 && cameFromJourney ? 'next-steps' : 'landing')}
      ${serviceCaption()}

      <h1 class="font-bold text-[2.25rem] sm:text-[2.75rem] leading-[1.15] text-bb-blue-00 mb-2">
        Do you already have an NISSS number?
      </h1>
      <p class="text-[1.25rem] text-bb-mid-grey-00 mb-6">
        If you worked for an employer before, you probably do. It's the same number for life.
      </p>

      <div class="space-y-3 mb-6" role="radiogroup" aria-label="Do you already have an NISSS number?">
        ${[
          { id: 'yes',    label: "Yes, I have one",                sub: "I worked for someone before, or registered already." },
          { id: 'no',     label: "No, I never registered",         sub: "I've always worked for myself." },
          { id: 'unsure', label: "I'm not sure",                   sub: "Let's find out together." },
        ].map(o => {
          const selected = state.data.alreadyHasNis === o.id;
          return `
            <button type="button" role="radio" aria-checked="${selected}"
              onclick="setHasNis('${o.id}')"
              class="selectable text-left rounded-xl border-2 border-bb-grey-00 bg-white p-4 w-full flex items-start gap-3 hover:border-bb-teal-00 hover:bg-bb-teal-10/40 focus:outline-none focus-visible:ring-4 focus-visible:ring-bb-teal-100 ${selected ? 'selected' : ''}">
              <span class="shrink-0 w-6 h-6 mt-1 rounded-full inline-flex items-center justify-center ${selected ? 'bg-bb-teal-00 text-white' : 'border-2 border-bb-grey-00 text-transparent'}">
                ${ICONS.check}
              </span>
              <span class="flex-1">
                <span class="block font-semibold text-[1.25rem] text-bb-blue-00">${o.label}</span>
                <span class="block text-[1rem] text-bb-mid-grey-00 mt-0.5">${o.sub}</span>
              </span>
            </button>
          `;
        }).join('')}
      </div>

      ${(() => {
        // Route straight to the right destination for each answer:
        //   yes → NIS self-employment registration form (they already have a number)
        //   no  → NIS new-applicant registration form
        //   unsure → contact page, so they can check their status before registering
        //            (sending them to the new-applicant form risks a duplicate)
        switch (state.data.alreadyHasNis) {
          case 'yes':
            return primaryLink('Continue', 'https://www.nis.gov.bb/self-employment-registration-form-page/');
          case 'no':
            return primaryLink('Continue', 'https://www.nis.gov.bb/self-employment-registration-form-new-nis-applicant/');
          case 'unsure':
            return primaryBtn('Continue', "nav('contact')");
          default:
            return primaryBtn('Continue', '', { disabled: true, hint: 'Choose one of the options above to continue.' });
        }
      })()}    </div>`;
}

            class="text-left rounded-xl border border-bb-grey-00 bg-white p-4 w-full flex items-center gap-3 hover:border-bb-teal-00 hover:bg-bb-teal-10/40 focus:outline-none focus-visible:ring-4 focus-visible:ring-bb-teal-100 transition-colors">
            <span class="shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-full bg-bb-blue-10 text-bb-blue-00">${ICONS[a.icon]}</span>
            <span class="flex-1 min-w-0">
              <span class="block font-semibold text-[1rem] text-bb-blue-00">${a.title}</span>
              <span class="block text-[1rem] text-bb-mid-grey-00 mt-0.5">${a.sub}</span>
            </span>
            <span class="text-bb-teal-00">${ICONS.arrowRight}</span>
          </button>
        `).join('')}
      </div>

      <p class="text-[0.95rem] text-bb-mid-grey-00 text-center">
        This is a prototype. Numbers shown here are for demonstration only.
      </p>
    </div>`;
}

/* ─────────────────────────────────────────────────────────
   Rendering + navigation
   ───────────────────────────────────────────────────────── */
const SCREENS = {
  'landing': screenLanding,
  'risk-awareness': screenRiskAwareness,
  'worker-type': screenWorkerType,
  'income-reality': screenIncomeReality,
  'your-situation': screenYourSituation,
  'plan': screenPlan,
  'next-steps': screenNextSteps,
  'benefits-quick': screenBenefitsQuick,
  'register-path': screenRegisterPath,
  'payment-options': screenPaymentOptions,
  'contact': screenContact,
  'tracker': screenTracker,
};

const TITLES = {
  'landing': 'Protect your income – NISSS Barbados',
  'risk-awareness': 'What if something happened? – NISSS Barbados',
  'worker-type': 'What kind of work do you do? – NISSS Barbados',
  'income-reality': "Let's talk about your earnings – NISSS Barbados",
  'your-situation': "Your situation – NISSS Barbados",
  'plan': 'Your contribution plan – NISSS Barbados',
  'next-steps': 'Next steps – NISSS Barbados',
  'benefits-quick': 'Six ways NISSS protects you – NISSS Barbados',
  'register-path': 'Do you have an NISSS number? – NISSS Barbados',
  'payment-options': 'How to pay – NISSS Barbados',
  'contact': 'Contact NISSS – NISSS Barbados',
  'tracker': 'Your NISSS contributions – NISSS Barbados',
};

/* Roving tabindex for the custom role="radio" groups (ARIA radio-group
   pattern): one tab stop per group, the checked option or else the first one.
   data-rg/data-ri give each radio a stable identity so focus can be put back
   on the equivalent button after an in-place re-render. */
function setupRadioGroups(root) {
  root.querySelectorAll('[role="radiogroup"]').forEach((group, gi) => {
    const radios = Array.from(group.querySelectorAll('[role="radio"]'));
    const checked = radios.findIndex(r => r.getAttribute('aria-checked') === 'true');
    const stop = checked === -1 ? 0 : checked;
    radios.forEach((r, ri) => {
      r.dataset.rg = gi;
      r.dataset.ri = ri;
      r.setAttribute('tabindex', ri === stop ? '0' : '-1');
    });
  });
}

// Arrow keys move AND select within a radio group; Home/End jump to first/last.
// Selection re-renders the screen, and render() restores focus to the
// equivalent radio, so focus (and scroll) stay put.
document.getElementById('app').addEventListener('keydown', (ev) => {
  // Leave OS shortcuts alone (Ctrl+Home, Cmd+Arrow scrolling, etc.):
  // modified keys must not change the answer.
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const radio = ev.target.closest('[role="radio"]');
  if (!radio) return;
  const group = radio.closest('[role="radiogroup"]');
  if (!group) return;
  const radios = Array.from(group.querySelectorAll('[role="radio"]'));
  const idx = radios.indexOf(radio);
  let next = null;
  if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') next = (idx + 1) % radios.length;
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') next = (idx - 1 + radios.length) % radios.length;
  else if (ev.key === 'Home') next = 0;
  else if (ev.key === 'End') next = radios.length - 1;
  if (next === null) return;
  ev.preventDefault();
  radios[next].focus();
  radios[next].click();
});

// Safari does not move focus to a button on mouse click, so
// document.activeElement is unreliable for restoring focus after an in-place
// re-render there. Record the activated radio's identity at click time
// (capture phase runs before the inline onclick handlers call render()).
let lastActivated = null;
document.getElementById('app').addEventListener('click', (ev) => {
  const el = ev.target.closest('[role="radio"]');
  lastActivated = el && el.dataset.rg !== undefined
    ? { rg: el.dataset.rg, ri: el.dataset.ri }
    : null;
}, true);

function render(opts = {}) {
  const root = document.getElementById('app');

  // Remember where focus was, so in-place re-renders (selecting a card or
  // radio rebuilds the whole screen) don't dump focus on <body>. Prefer the
  // click-time record; fall back to activeElement (keyboard activation).
  const prev = document.activeElement;
  let restore = lastActivated;
  lastActivated = null;
  if (!restore && prev && prev !== document.body && root.contains(prev)) {
    if (prev.dataset && prev.dataset.rg !== undefined) restore = { rg: prev.dataset.rg, ri: prev.dataset.ri };
    else if (prev.id) restore = { id: prev.id };
  }

  // Entrance animation only on real navigation; in-place re-renders would
  // replay the fade on every arrow press.
  root.classList.toggle('no-anim', !opts.scroll);

  root.innerHTML = (SCREENS[state.screen] || screenLanding)();
  document.title = (Object.keys(state.errors).length ? 'Error: ' : '') + (TITLES[state.screen] || TITLES.landing);
  setupRadioGroups(root);

  // Scroll to top ONLY when navigating between screens, not on in-page re-renders
  // (selecting cards, picking radio options, etc.)
  if (opts.scroll) {
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
  // Focus the error summary only on a render caused by a submit attempt.
  // Re-renders from answering a field (e.g. picking a contact method while
  // errors are showing) must keep focus where the user is working.
  if (opts.focusErrors && Object.keys(state.errors).length && document.getElementById('error-summary')) {
    document.getElementById('error-summary').focus();
  } else if (opts.focusHeading) {
    // Screen change: move focus to the new screen's H1 so screen readers
    // announce where the user has landed (replaces the old whole-app
    // aria-live region, which re-read the entire page on every re-render).
    const h1 = root.querySelector('h1');
    if (h1) {
      h1.setAttribute('tabindex', '-1');
      h1.focus({ preventScroll: true });
    }
  } else if (restore) {
    const el = restore.id
      ? document.getElementById(restore.id)
      : root.querySelector(`[data-rg="${restore.rg}"][data-ri="${restore.ri}"]`);
    if (el) el.focus({ preventScroll: true });
  }
}

function nav(screen) {
  state.screen = screen;
  state.errors = {};
  state.expandedScenario = null;
  render({ scroll: true, focusHeading: true });
}

function selectWorker(id) {
  state.data.workerType = id;
  render();
}
function selectMainJob(id) {
  state.data.hasMainJob = id;
  render();
}
function nextFromWorkerType() {
  if (!state.data.workerType) return;
  nav('income-reality');
}

/* ─────────────────────────────────────────────────────────
   Income input validation (issue #45)

   The old handler clamped state silently while the field kept whatever was
   typed, so the estimate could use a number the user never saw. Now state
   mirrors exactly what is parseable from the field (null when it is empty or
   unreadable), the benign is normalised visibly (exponent notation,
   fractional dollars, formatted paste) and everything else blocks Continue
   with a register-screen-style error.
   ───────────────────────────────────────────────────────── */
function updateIncomeField(field, el, source) {
  const typedId = field + '-typed';
  const bad = source === 'typed' && el.validity && el.validity.badInput;
  const rawStr = String(el.value);
  const num = bad || rawStr.trim() === '' ? null : Number(rawStr);
  state.data[field] = num;
  state.badInput[typedId] = !!bad;
  state.raw[typedId] = source === 'typed' ? rawStr : String(num);

  // Update the big read-only display value. Empty or unreadable input shows
  // nothing rather than a substituted number.
  const display = document.getElementById(field + '-display');
  if (display) display.textContent = num == null ? '' : fmtMoney(num);

  // Update slider (unless the slider itself was the source — leaves the thumb
  // where the user dragged it). Out-of-range values pin the thumb at an end;
  // they still error on Continue.
  const slider = document.getElementById(field);
  if (slider && num != null) {
    if (source !== 'slider') slider.value = Math.max(0, Math.min(6000, num));
    slider.style.backgroundSize = Math.max(0, Math.min(100, (num / 6000) * 100)) + '% 100%';
  }

  // Update typed input (unless the input itself was the source — avoids cursor jumping while typing)
  if (source !== 'typed') {
    const typed = document.getElementById(typedId);
    if (typed) typed.value = num;
  }
  updateCeilingNote(field);
}

// On change (leaving the field): make benign oddities look like what they
// mean. "1e3" becomes 1000 and "8.5" becomes 9, visibly, in field and state.
// Out-of-range values are left alone so Continue can name the problem.
function normaliseIncomeField(field, el) {
  const num = state.data[field];
  if (num != null && isFinite(num)) {
    const whole = Math.round(num);
    el.value = whole;
    updateIncomeField(field, el, 'typed');
  }
  updateCeilingNote(field);
}

// Show the insurable-ceiling note when the entry exceeds it; announce only on
// the hidden -> shown transition so arrowing around the value is not chatty.
function updateCeilingNote(field) {
  const box = document.getElementById(field + '-ceiling');
  const text = document.getElementById(field + '-ceiling-text');
  if (!box || !text) return;
  const over = (state.data[field] || 0) > NIS.MAX_MONTHLY_INSURABLE;
  if (over && box.hidden) {
    box.hidden = false;
    setLiveRegion(text, CEILING_NOTE);
  } else if (!over && !box.hidden) {
    box.hidden = true;
    text.textContent = '';
  }
}

function updateGoodMonths(el) {
  const bad = el.validity && el.validity.badInput;
  const rawStr = String(el.value);
  state.badInput.goodMonthsPerYear = !!bad;
  state.raw.goodMonthsPerYear = rawStr;
  state.data.goodMonthsPerYear = bad || rawStr.trim() === '' ? null : Number(rawStr);
}

// Only exponent notation is normalised here ("1e1" means 10). Fractional
// months are an error, not a rounding, so they are left for Continue.
function normaliseGoodMonths(el) {
  const num = state.data.goodMonthsPerYear;
  if (num == null || !Number.isInteger(num)) return;
  el.value = num;
  updateGoodMonths(el);
}

// Pasted numbers often carry formatting ("2,500", "$2,500", "BDS$2 500").
// A number input silently refuses such text, so strip benign formatting first
// and let clearly numeric pastes land as plain digits. Anything else falls
// through to the browser and is caught by validation.
function numberPaste(ev) {
  const text = (ev.clipboardData || window.clipboardData).getData('text');
  const cleaned = text.replace(/bds\$?/gi, '').replace(/[$,\s]/g, '');
  if (cleaned === '' || isNaN(Number(cleaned))) return;
  ev.preventDefault();
  const el = ev.target;
  el.value = cleaned;
  el.dispatchEvent(new Event('input'));
}

// GOV.BB pattern-library error summary (Figma node 1854-2289): 4px red-00
// border, white background, 32/24 padding, bold black heading, each error an
// underlined red link to its field. Rendered on Continue; kept in sync in
// place as blur-time fixes land so it never lists a fixed error.
const INCOME_FIELD_ORDER = ['goodMonth-typed', 'slowMonth-typed', 'goodMonthsPerYear'];
function errorSummary() {
  const keys = INCOME_FIELD_ORDER.filter(k => state.errors[k]);
  if (!keys.length) return '';
  return `
    <div id="error-summary" tabindex="-1" role="alert" class="border-4 border-bb-red-00 bg-white px-8 py-6 mb-6 outline-none focus-visible:ring-4 focus-visible:ring-bb-teal-100">
      <p class="font-bold text-bb-black-00 mb-2">There is a problem</p>
      <div class="flex flex-col gap-1">
        ${keys.map(k => `<a href="#${k}" class="underline text-bb-red-00 w-fit" onclick="document.getElementById('${k}').focus(); return false;">${state.errors[k]}</a>`).join('')}
      </div>
    </div>`;
}
// Rebuild or remove the rendered summary to mirror state.errors (blur fixes).
function syncErrorSummary() {
  const el = document.getElementById('error-summary');
  if (!el) return;
  const keys = INCOME_FIELD_ORDER.filter(k => state.errors[k]);
  if (!keys.length) { el.remove(); return; }
  const list = el.querySelector('div');
  if (list) list.innerHTML = keys.map(k => `<a href="#${k}" class="underline text-bb-red-00 w-fit" onclick="document.getElementById('${k}').focus(); return false;">${state.errors[k]}</a>`).join('');
}

// One rule per field; returns the error message or null. Assumes the field
// has been normalised. Every question on this screen is required.
function incomeFieldError(field) {
  if (field === 'goodMonthsPerYear') {
    const el = document.getElementById('goodMonthsPerYear');
    const gm = state.data.goodMonthsPerYear;
    if (el && el.validity.badInput) return 'Enter a whole number of months from 1 to 12.';
    if (gm == null) return 'Enter how many good months you have in a year.';
    if (!Number.isInteger(gm) || gm < 1 || gm > 12) return 'Enter a whole number of months from 1 to 12.';
    return null;
  }
  const label = field === 'goodMonth' ? 'good month' : 'slow month';
  const el = document.getElementById(field + '-typed');
  const num = state.data[field];
  if (el && el.validity.badInput) return 'Enter your ' + label + ' amount using numbers only.';
  if (num == null) return 'Enter your ' + label + ' amount.';
  if (num < 0) return 'Enter an amount of BDS$0 or more.';
  return null;
}

// Blur-time validation: show or clear the field's inline error in place —
// no re-render, so focus and carets are never disturbed.
const INCOME_DEFAULT_BORDER = { goodMonth: 'border-bb-black-00', slowMonth: 'border-bb-black-00', goodMonthsPerYear: 'border-bb-grey-00' };
function validateIncomeField(field) {
  const inputId = field === 'goodMonthsPerYear' ? field : field + '-typed';
  const input = document.getElementById(inputId);
  if (!input) return null;
  if (field === 'goodMonthsPerYear') normaliseGoodMonths(input); else normaliseIncomeField(field, input);
  const msg = incomeFieldError(field);
  const errEl = document.getElementById(inputId + '-error');
  if (errEl) { errEl.hidden = !msg; errEl.textContent = msg || ''; }
  if (msg) { state.errors[inputId] = msg; input.setAttribute('aria-invalid', 'true'); }
  else { delete state.errors[inputId]; input.removeAttribute('aria-invalid'); }
  const wrap = input.closest('.border-2');
  if (wrap) {
    wrap.classList.toggle('border-bb-red-00', !!msg);
    wrap.classList.toggle(INCOME_DEFAULT_BORDER[field], !msg);
  }
  document.title = (Object.keys(state.errors).length ? 'Error: ' : '') + (TITLES[state.screen] || '');
  syncErrorSummary();
  return msg;
}

function nextFromIncome() {
  // Same per-field rules as blur; first invalid field gets focus. Errors are
  // shown at the fields (surfaced as the user leaves each one), so there is
  // no submit-time summary on this screen.
  const fields = ['goodMonth', 'slowMonth', 'goodMonthsPerYear'];
  let any = false;
  fields.forEach(f => { if (validateIncomeField(f)) any = true; });
  if (any) {
    render({ focusErrors: true });
    return;
  }
  nav(LEAN_ESTIMATOR ? 'plan' : 'your-situation');
}

function setDependants(id) {
  const was = state.data.hasDependants;
  state.data.hasDependants = id;
  // Switching the radio resets the count to a stored value, so any leftover
  // invalid text must not be echoed back over it.
  delete state.raw.dependantsCount;
  state.badInput.dependantsCount = false;
  if (id === 'yes' && !state.data.dependantsCount) {
    // Restore what the user last typed; arrow-scanning through "No" and
    // back must not wipe it. Default to 1 for a first-time "Yes".
    state.data.dependantsCount = state.data.lastDependantsCount || 1;
  }
  if (id === 'no') {
    if (state.data.dependantsCount) state.data.lastDependantsCount = state.data.dependantsCount;
    state.data.dependantsCount = 0;
  }
  render();
  if (id === 'yes' && was !== 'yes') {
    announce('A question about how many people depend on you was added below.');
  }
}

// Inline error for the dependants count (issue #45). The your-situation
// Continue is gated (aria-disabled, PR #41) rather than validated on submit,
// so problems the gate cannot express are reported next to the field as the
// user types. Empty stays the gate's job: no message, hint explains.
function dependantsCountError() {
  if (state.badInput.dependantsCount) return 'Enter a number using digits only.';
  const raw = state.raw.dependantsCount;
  if (raw === undefined || String(raw).trim() === '') return null;
  const num = Number(raw);
  if (!Number.isInteger(num)) return 'Enter a whole number, like 2.';
  if (num < 1 || num > 20) return 'Enter a number from 1 to 20.';
  return null;
}

function updateDependantsCount(el) {
  const bad = el.validity && el.validity.badInput;
  const rawStr = String(el.value);
  state.badInput.dependantsCount = !!bad;
  state.raw.dependantsCount = rawStr;
  const num = bad || rawStr.trim() === '' ? null : Number(rawStr);
  // Only a usable value reaches state; anything else stays 0 (falsy), which
  // keeps the Continue gate closed so the estimate can never see it.
  const valid = num != null && Number.isInteger(num) && num >= 1 && num <= 20;
  state.data.dependantsCount = valid ? num : 0;

  // Field-level feedback in place — a full render() would fight the caret.
  const msg = dependantsCountError();
  const errEl = document.getElementById('dependantsCount-error');
  if (errEl) errEl.textContent = msg || '';
  el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  const wrap = document.getElementById('dependantsCount-wrap');
  if (wrap) {
    wrap.classList.toggle('border-bb-red-00', !!msg);
    wrap.classList.toggle('border-bb-grey-00', !msg);
  }
  // Keep the Continue button honest: clearing the count must disable it
  // again. Refresh the button in place, with no full re-render while typing.
  const holder = document.getElementById('situation-continue');
  if (holder) holder.innerHTML = situationContinue();
}

// On change: write exponent notation back as plain digits ("1e1" means 10).
// Invalid values are left visible with their inline error.
function normaliseDependantsCount(el) {
  if (!state.data.dependantsCount) return;
  el.value = state.data.dependantsCount;
  updateDependantsCount(el);
}

function toggleScenario(id, ev) {
  // Let the native details/summary handle open state; we just track which is open for re-render fidelity
  // Defer state update so the click-on-summary toggling completes naturally
  setTimeout(() => {
    const el = ev.currentTarget;
    if (!el) return;
    state.expandedScenario = el.open ? id : null;
  }, 0);
}

function selectTier(id) {
  const prev = state.data.contributionTier;
  state.data.contributionTier = id;
  render();
  // The first pick reveals the plan hero and benefit cards below the group,
  // so tell screen-reader users. Every later CHANGE silently rewrites all
  // the benefit figures, so say that too. Re-picking the same tier changes
  // nothing and says nothing.
  if (prev === id) return;
  if (!prev) {
    announce('Your plan details are shown below.');
  } else {
    const label = { minimum: 'Minimum', safer: 'Moderate', strong: 'Stronger' }[id] || id;
    announce(`Estimates updated for the ${label} plan.`);
  }
}

function setHasNis(id) {
  state.data.alreadyHasNis = id;
  render();
}

// Initial render — first render scrolls to top for screen-reader users landing on the page
render({ scroll: true });
</script>
